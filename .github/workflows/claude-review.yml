name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review content changes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            This repo (see AGENTS.md and docs/kor|eng/*.md) is a personal
            weekly technical-blog draft pipeline, not a software project.
            Review the changed files in this PR with that in mind:

            1. **Frontmatter & structure** - title/description/tags/date/status
               present; body follows 들어가며 -> 본문 -> 마치며 -> References.
            2. **Bilingual consistency** - if both index.ko.md and index.en.md
               changed, confirm they stay structurally and factually aligned,
               and that "코딩 도감" is localized as "Codigdex" in English (not
               transliterated), per the established series voice.
            3. **Image references** - every ./images/... path referenced in
               the Markdown actually exists among the changed/existing files;
               no broken links.
            4. **Editing constraints from AGENTS.md** - no unauthorized
               overwriting of existing images, no unrelated frontmatter or
               heading changes, status stays `draft` unless the PR explicitly
               says otherwise.
            5. **Typos / awkward phrasing** in the Korean and English text.

            This is a content review, not a software code review - do not ask
            for tests, linters, or engineering practices that don't apply
            here. Use inline comments for specific line issues, and a
            top-level comment for overall observations.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
