name: PR metadata

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review, closed]

permissions:
  contents: read

jobs:
  apply-metadata:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Apply labels, milestone, and assignee
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: context.payload.pull_request.number,
            });

            // The type comes from the Conventional Commit prefix after the optional
            // COD-<n> key, e.g. "COD-12 content: ..." or "docs: sync ... to main".
            const typeLabels = {
              content: "type: content",
              docs: "type: docs",
              feat: "type: feature",
              fix: "type: fix",
              ci: "type: ci",
              chore: "type: chore",
              test: "type: test",
            };
            const prefix = pr.title
              .replace(/^COD-\d+\s+/i, "")
              .match(/^([a-z]+)(\([^)]*\))?!?:/)?.[1];
            const typeLabel = typeLabels[prefix];
            if (!typeLabel) {
              core.setFailed(
                `PR title must start with a known type (${Object.keys(typeLabels).join(", ")}): "${pr.title}"`
              );
              return;
            }
            const flowLabel = pr.base.ref === "main" ? "flow: sync" : "flow: feature";

            // A PR belongs to the chapter in progress: the open "코딩 도감 #NN" milestone
            // due soonest. The chapter milestone is closed when its release is cut.
            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const chapter = milestones
              .filter(milestone => /^코딩 도감 #\d+/.test(milestone.title))
              .sort((a, b) => (a.due_on || "9999").localeCompare(b.due_on || "9999"))[0];
            if (!chapter) {
              core.setFailed('No open "코딩 도감 #NN <chapter>" milestone; create the next chapter milestone first');
              return;
            }

            const keep = pr.labels
              .map(label => label.name)
              .filter(name => !name.startsWith("type: ") && !name.startsWith("flow: "));
            const labels = [...keep, typeLabel, flowLabel];

            const targets = [pr.number];
            const mirroredIssue = Number((pr.body || "").match(/\bCloses\s+#(\d+)\b/i)?.[1]);
            if (mirroredIssue) targets.push(mirroredIssue);

            for (const issue_number of targets) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                labels: issue_number === pr.number ? labels : [typeLabel],
                milestone: chapter.number,
                assignees: [owner],
              });
            }
            core.info(`#${targets.join(", #")}: ${labels.join(", ")} · ${chapter.title} · @${owner}`);

  delete-merged-feature-branch:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.base_ref == 'develop' &&
      startsWith(github.head_ref, 'feat/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the merged feat/* branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = `heads/${context.payload.pull_request.head.ref}`;
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref });
              core.info(`Deleted ${ref}`);
            } catch (error) {
              if (error.status === 422 || error.status === 404) {
                core.info(`${ref} was already deleted`);
              } else {
                throw error;
              }
            }
